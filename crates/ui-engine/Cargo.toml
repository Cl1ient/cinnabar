[package]
name = "ui-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
test-support = []

[dependencies]
assets = { path = "../assets" }
crossbeam-channel = "0.5"
image.workspace = true
json-ui = { path = "../json-ui" }
rayon.workspace = true
render-model = { path = "../render-model" }
resource-pack = { path = "../resource-pack", default-features = false }
serde_json = "1"
sha2.workspace = true
tracing.workspace = true
ui = { path = "../ui" }

[dev-dependencies]
protocol = { path = "../protocol" }
resource-pack = { path = "../resource-pack" }
test-time = { path = "../test-time" }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
